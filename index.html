<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login Semcomp</title>
    <script>
        window.onload = function() {
            // Pega os parâmetros do Google (onde está o ?code=...)
            var queryString = window.location.search;
            
            // Força o celular a fechar o navegador e abrir o jogo
            window.location.href = "meujogo://oauth" + queryString;
        };
    </script>
</head>
<body style="background-color: #222; color: white; text-align: center; font-family: sans-serif; padding-top: 50px;">
    <h2>Autenticando...</h2>
    <p>Redirecionando de volta para o jogo.</p>
</body>
</html>
